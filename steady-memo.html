<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Steady</title>
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Steady">
<link rel="apple-touch-icon" href="/icon-512.png">
<meta name="theme-color" content="#4a3420">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=DM+Mono:wght@300;400;500&family=Geist:wght@400;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ivory:      #f5f0e8;
    --ivory-mid:  #ede5d8;
    --ivory-deep: #e2d8c8;
    --ivory-dark: #cbbea8;
    --wood-dark:  #7a5c38;
    --bark:       #4a3420;
    --text-soft:  #b09070;
    --text-xsoft: #cfc0a8;
  }
  html, body { height: 100%; background: #ddd5c4; }
  .app { max-width: 390px; min-height: 100vh; margin: 0 auto; background: var(--ivory); display: flex; flex-direction: column; }

  /* ── 헤더 ── */
  .header {
    padding: 52px 20px 0;
    background: var(--ivory);
    border-bottom: 1px solid var(--ivory-deep);
    position: sticky; top: 0; z-index: 10;
  }
  .header-top { display: flex; align-items: flex-end; justify-content: space-between; padding-bottom: 12px; }
  .wordmark {
    font-family: 'Cormorant Garamond', serif;
    font-size: 24px; font-weight: 600; font-style: italic;
    color: var(--bark); letter-spacing: -0.02em;
    display: flex; align-items: center; gap: 8px;
  }
  .wordmark-icon {
    width: 28px; height: 28px; border-radius: 7px;
    background: linear-gradient(155deg, #5a3e24, #2e1f10);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 8px rgba(46,31,16,0.3); flex-shrink: 0;
  }

  /* ── 시트 탭 ── */
  .sheet-tabs {
    display: flex; gap: 0;
    padding: 0 0 0;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .sheet-tabs::-webkit-scrollbar { display: none; }

  .sheet-tab {
    flex-shrink: 0;
    padding: 8px 16px 10px;
    font-family: 'Geist', sans-serif;
    font-size: 12px; font-weight: 500;
    color: var(--text-soft);
    border-bottom: 2px solid transparent;
    cursor: pointer; transition: all 0.15s;
    white-space: nowrap;
    position: relative;
  }
  .sheet-tab.active {
    color: var(--bark); font-weight: 700;
    border-bottom-color: var(--bark);
  }
  .sheet-tab:hover:not(.active) { color: var(--text-soft); border-bottom-color: var(--ivory-deep); }

  /* 탭 이름 편집 */
  .sheet-tab-name {
    outline: none;
    min-width: 40px; display: inline-block;
    caret-color: var(--bark);
  }
  .sheet-tab-name:focus { color: var(--bark); }

  /* ── 에디터 ── */
  .scroll { flex: 1; overflow-y: auto; padding-bottom: 100px; }
  .editor-wrap { padding: 20px 20px 40px; min-height: 100%; display: none; }
  .editor-wrap.active { display: block; }

  .editor {
    min-height: 400px; outline: none;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px; font-weight: 400;
    color: var(--bark); line-height: 1.9;
    caret-color: var(--wood-dark); word-break: break-word;
  }
  .editor:empty::before {
    content: attr(data-placeholder);
    color: var(--text-xsoft); pointer-events: none; font-weight: 300;
  }

  /* ── 플로팅 툴바 ── */
  .fmt-toolbar {
    position: fixed; background: var(--bark); border-radius: 10px;
    padding: 5px 10px; display: none; align-items: center; gap: 4px;
    z-index: 100; box-shadow: 0 4px 20px rgba(46,31,16,0.4);
  }
  .fmt-toolbar.show { display: flex; }
  .fmt-btn {
    width: 32px; height: 30px; border: none; background: transparent;
    color: rgba(245,240,232,0.7); border-radius: 6px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Geist', sans-serif; font-size: 13px; font-weight: 700;
    transition: background 0.15s, color 0.15s; flex-shrink: 0;
  }
  .fmt-btn:hover  { background: rgba(255,255,255,0.15); color: var(--ivory); }
  .fmt-btn.active { background: rgba(255,255,255,0.2);  color: var(--ivory); }
  .fmt-sep { width: 1px; height: 18px; background: rgba(245,240,232,0.2); margin: 0 2px; flex-shrink: 0; }
  .fmt-size {
    background: transparent; border: none; color: rgba(245,240,232,0.85);
    font-family: 'DM Mono', monospace; font-size: 11px; cursor: pointer;
    padding: 0 6px; height: 30px; border-radius: 6px; outline: none;
    -webkit-appearance: none; min-width: 36px;
  }
  .fmt-size option { background: #4a3420; color: #f5f0e8; }
  .hl-wrap { display: flex; align-items: center; gap: 4px; padding: 0 2px; }
  .hl-dot {
    width: 18px; height: 18px; border-radius: 50%; cursor: pointer;
    border: 1.5px solid rgba(255,255,255,0.25); flex-shrink: 0; transition: transform 0.12s;
  }
  .hl-dot:hover { transform: scale(1.15); }
  .hl-off {
    background: transparent !important; border: 1.5px solid rgba(245,240,232,0.4) !important;
    color: rgba(245,240,232,0.6); font-size: 10px;
    display: flex; align-items: center; justify-content: center;
  }

  /* ── 탭바 ── */
  .tabbar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 390px; z-index: 25;
    background: rgba(245,240,232,0.96); backdrop-filter: blur(12px);
    border-top: 1px solid #e2d8c8;
    padding: 14px 8px 28px;
    display: flex; justify-content: space-around; align-items: center;
  }
  .tab-item { display: flex; align-items: center; justify-content: center; flex: 1; cursor: pointer; padding: 4px; border-radius: 10px; }
  .tab-item svg { width: 28px; height: 28px; stroke: #cbbea8; fill: none; }
  .tab-item svg circle { fill: #cbbea8; stroke: none; }
  .tab-item.active svg { stroke: #4a3420; }
  .tab-item.active svg circle { fill: #4a3420; }
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="header-top">
      <div class="wordmark">
        <div class="wordmark-icon">
          <svg width="18" height="18" viewBox="0 0 100 100" fill="none">
            <ellipse cx="46" cy="91" rx="18" ry="4.5" fill="#1a0e06" opacity="0.45"/>
            <ellipse cx="46" cy="89.5" rx="13" ry="3" fill="#2e1f10" opacity="0.6"/>
            <path d="M46 88 C64 75 64 48 50 30" stroke="#c9a97a" stroke-width="5.5" stroke-linecap="round"/>
            <path d="M50 30 C44 20 26 10 8 12 C10 26 24 40 42 42 C47 43 50 37 50 30 Z" fill="#a8845a"/>
            <path d="M50 30 C60 18 78 8 94 8 C92 24 78 38 60 42 C54 44 50 38 50 30 Z" fill="#c9a97a"/>
          </svg>
        </div>
        Steady
      </div>
    </div>

    <!-- 시트 탭 4개 -->
    <div class="sheet-tabs" id="sheet-tabs">
      <div class="sheet-tab active" data-idx="0" onclick="switchSheet(0)">
        <span class="sheet-tab-name" id="tabname-0" spellcheck="false"
          onblur="saveTabName(0,this)"
          onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}">메모 1</span>
      </div>
      <div class="sheet-tab" data-idx="1" onclick="switchSheet(1)">
        <span class="sheet-tab-name" id="tabname-1" spellcheck="false"
          onblur="saveTabName(1,this)"
          onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}">메모 2</span>
      </div>
      <div class="sheet-tab" data-idx="2" onclick="switchSheet(2)">
        <span class="sheet-tab-name" id="tabname-2" spellcheck="false"
          onblur="saveTabName(2,this)"
          onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}">메모 3</span>
      </div>
      <div class="sheet-tab" data-idx="3" onclick="switchSheet(3)">
        <span class="sheet-tab-name" id="tabname-3" spellcheck="false"
          onblur="saveTabName(3,this)"
          onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}">메모 4</span>
      </div>
    </div>
  </div>

  <div class="scroll">
    <div class="editor-wrap active" id="wrap-0">
      <div class="editor" id="editor-0" contenteditable="true" data-placeholder="자유롭게 입력하세요..." spellcheck="false"></div>
    </div>
    <div class="editor-wrap" id="wrap-1">
      <div class="editor" id="editor-1" contenteditable="true" data-placeholder="자유롭게 입력하세요..." spellcheck="false"></div>
    </div>
    <div class="editor-wrap" id="wrap-2">
      <div class="editor" id="editor-2" contenteditable="true" data-placeholder="자유롭게 입력하세요..." spellcheck="false"></div>
    </div>
    <div class="editor-wrap" id="wrap-3">
      <div class="editor" id="editor-3" contenteditable="true" data-placeholder="자유롭게 입력하세요..." spellcheck="false"></div>
    </div>
  </div>

  <!-- 플로팅 툴바 -->
  <div class="fmt-toolbar" id="fmt-toolbar">
    <select class="fmt-size" id="fmt-size" onchange="applySize(this.value)">
      <option value="12">12</option>
      <option value="14" selected>14</option>
      <option value="16">16</option>
      <option value="18">18</option>
      <option value="22">22</option>
    </select>
    <div class="fmt-sep"></div>
    <button class="fmt-btn" id="btn-bold"      onmousedown="return false" onclick="fmt('bold')">B</button>
    <button class="fmt-btn" id="btn-italic"    onmousedown="return false" onclick="fmt('italic')" style="font-style:italic">I</button>
    <button class="fmt-btn" id="btn-underline" onmousedown="return false" onclick="fmt('underline')" style="text-decoration:underline">U</button>
    <div class="fmt-sep"></div>
    <div class="hl-wrap">
      <div class="hl-dot hl-off" onmousedown="return false" onclick="applyHL(null)">✕</div>
      <div class="hl-dot" style="background:#fff176" onmousedown="return false" onclick="applyHL('#fff176')"></div>
      <div class="hl-dot" style="background:#a5d6a7" onmousedown="return false" onclick="applyHL('#a5d6a7')"></div>
      <div class="hl-dot" style="background:#f4b8a0" onmousedown="return false" onclick="applyHL('#f4b8a0')"></div>
      <div class="hl-dot" style="background:#b3d9ff" onmousedown="return false" onclick="applyHL('#b3d9ff')"></div>
    </div>
  </div>


</div>

<script>
  let curSheet = 0;
  const TOTAL  = 4;
  const saveTimers = {};

  // ── localStorage ──────────────────────
  function saveContent(idx) {
    const el = document.getElementById('editor-'+idx);
    if (!el) return;
    try { localStorage.setItem('memo_content_'+idx, el.innerHTML); } catch(e){}
  }
  function loadContent(idx) {
    try {
      const v = localStorage.getItem('memo_content_'+idx);
      const el = document.getElementById('editor-'+idx);
      if (el && v) el.innerHTML = v;
    } catch(e){}
  }
  function saveTabName(idx, el) {
    try { localStorage.setItem('memo_tab_'+idx, el.textContent.trim()); } catch(e){}
  }
  function loadTabName(idx) {
    try { return localStorage.getItem('memo_tab_'+idx) || ('메모 '+(idx+1)); } catch(e){ return '메모 '+(idx+1); }
  }

  // ── 시트 전환 ─────────────────────────
  function switchSheet(idx) {
    saveContent(curSheet);

    // 탭 UI
    document.querySelectorAll('.sheet-tab').forEach((t,i) => {
      t.classList.toggle('active', i === idx);
    });

    // 탭 이름: 활성 탭만 contenteditable
    for (let i = 0; i < TOTAL; i++) {
      const tn = document.getElementById('tabname-'+i);
      if (tn) tn.contentEditable = (i === idx) ? 'true' : 'false';
    }

    // 에디터 표시
    for (let i = 0; i < TOTAL; i++) {
      const w = document.getElementById('wrap-'+i);
      if (w) w.classList.toggle('active', i === idx);
    }
    curSheet = idx;
    toolbar.classList.remove('show');
  }

  // ── 편집 이벤트 ───────────────────────
  for (let i = 0; i < TOTAL; i++) {
    const el = document.getElementById('editor-'+i);
    if (!el) continue;
    const idx = i;
    el.addEventListener('input', () => {
      clearTimeout(saveTimers[idx]);
      saveTimers[idx] = setTimeout(() => saveContent(idx), 500);
    });
  }

  // ── 포맷 ──────────────────────────────
  function fmt(cmd) { document.execCommand(cmd, false, null); updateState(); }
  function applySize(size) {
    document.execCommand('fontSize', false, '7');
    document.querySelectorAll('.editor font[size="7"]').forEach(f => {
      const s = document.createElement('span');
      s.style.fontSize = size + 'px';
      f.parentNode.insertBefore(s, f);
      while (f.firstChild) s.appendChild(f.firstChild);
      f.remove();
    });
  }
  function applyHL(color) { document.execCommand('hiliteColor', false, color || 'transparent'); }
  function updateState() {
    document.getElementById('btn-bold').classList.toggle('active',      document.queryCommandState('bold'));
    document.getElementById('btn-italic').classList.toggle('active',    document.queryCommandState('italic'));
    document.getElementById('btn-underline').classList.toggle('active', document.queryCommandState('underline'));
  }

  // ── 툴바 위치 ─────────────────────────
  const toolbar = document.getElementById('fmt-toolbar');
  let tbTimer = null;

  function positionToolbar() {
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed || !sel.toString().trim()) { toolbar.classList.remove('show'); return; }
    const rect = sel.getRangeAt(0).getBoundingClientRect();
    if (!rect.width) { toolbar.classList.remove('show'); return; }
    toolbar.classList.add('show'); updateState();
    const tbW = toolbar.offsetWidth || 280;
    const tbH = toolbar.offsetHeight || 44;
    let left = rect.left + rect.width / 2 - tbW / 2;
    left = Math.max(12, Math.min(left, window.innerWidth - tbW - 12));
    let top = rect.top - tbH - 10;
    if (top < 60) top = rect.bottom + 10;
    toolbar.style.left = left + 'px';
    toolbar.style.top  = top  + 'px';
  }

  document.addEventListener('selectionchange', () => {
    clearTimeout(tbTimer); tbTimer = setTimeout(positionToolbar, 60);
  });
  document.addEventListener('mousedown', e => {
    if (!toolbar.contains(e.target)) {
      const activeEditor = document.getElementById('editor-'+curSheet);
      if (activeEditor && !activeEditor.contains(e.target)) toolbar.classList.remove('show');
    }
  });

  // ── 초기화 ────────────────────────────
  document.addEventListener('DOMContentLoaded', () => {
    // 탭 이름 로드 + contentEditable 초기 설정
    for (let i = 0; i < TOTAL; i++) {
      const el = document.getElementById('tabname-'+i);
      if (el) {
        el.textContent = loadTabName(i);
        el.contentEditable = (i === 0) ? 'true' : 'false';
      }
    }
    // 내용 로드
    for (let i = 0; i < TOTAL; i++) loadContent(i);
  });
</script>

<!-- 탭바 3개 -->
  <div class="tabbar">
    <div class="tab-item" onclick="location.href='steady-calendar.html'">
      <svg viewBox="0 0 26 26" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="20" height="19" rx="2"/>
        <path d="M3 10h20M8 2v4M18 2v4"/>
        <path d="M9 15l2.5 2.5L17 12"/>
      </svg>
    </div>
    <div class="tab-item" onclick="location.href='steady-log.html'">
      <svg viewBox="0 0 26 26" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="5" cy="7"  r="1.5"/>
        <line x1="9" y1="7"  x2="22" y2="7"/>
        <circle cx="5" cy="13" r="1.5"/>
        <line x1="9" y1="13" x2="22" y2="13"/>
        <circle cx="5" cy="19" r="1.5"/>
        <line x1="9" y1="19" x2="18" y2="19"/>
      </svg>
    </div>
    <div class="tab-item active">
      <svg viewBox="0 0 26 26" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 3H6a2 2 0 00-2 2v16a2 2 0 002 2h14a2 2 0 002-2V9l-7-6z"/>
        <path d="M15 3v6h7"/>
      </svg>
    </div>
  </div>
</body>
</html>
