<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Steady — 로그</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=DM+Mono:wght@300;400;500&family=Geist:wght@400;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ivory:      #f5f0e8;
    --ivory-mid:  #ede5d8;
    --ivory-deep: #e2d8c8;
    --ivory-dark: #cbbea8;
    --wood-mid:   #a8845a;
    --wood-dark:  #7a5c38;
    --bark:       #4a3420;
    --text-soft:  #b09070;
    --text-xsoft: #cfc0a8;
    --cardio-bg:  rgba(180,100,60,0.13);
    --cardio-bdr: rgba(180,100,60,0.45);
    --cardio-txt: #8b4a20;
    --str-bg:     rgba(44,74,50,0.13);
    --str-bdr:    rgba(44,74,50,0.42);
    --str-txt:    #2c4a32;
    --rec-bg:     rgba(80,100,140,0.10);
    --rec-bdr:    rgba(80,100,140,0.36);
    --rec-txt:    #3a4e6e;
  }
  html, body { height: 100%; background: #ddd5c4; }
  .app { max-width: 390px; min-height: 100vh; margin: 0 auto; background: var(--ivory); display: flex; flex-direction: column; }

  /* ── 헤더 ── */
  .header {
    padding: 52px 0 0;
    background: var(--ivory);
    position: sticky; top: 0; z-index: 10;
    border-bottom: 1px solid var(--ivory-deep);
  }
  .header-top {
    display: flex; align-items: flex-end; justify-content: space-between;
    padding: 0 14px 12px;
  }
  .wordmark {
    font-family: 'Cormorant Garamond', serif;
    font-size: 24px; font-weight: 600; font-style: italic;
    color: var(--bark); letter-spacing: -0.02em;
    display: flex; align-items: center; gap: 8px;
  }
  .wordmark-icon {
    width: 28px; height: 28px; border-radius: 7px;
    background: linear-gradient(155deg, #5a3e24, #2e1f10);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 8px rgba(46,31,16,0.3); flex-shrink: 0;
  }

  /* ── 공통 그리드 ── */
  /* 헤더와 데이터 행이 완전히 동일한 그리드 */
  .g-row {
    display: grid;
    grid-template-columns: 56px 1fr 1fr 1fr;
    gap: 4px;
    padding: 0 14px;
    box-sizing: border-box;
    width: 100%;
  }

  /* 컬럼 헤더 (sticky) */
  .col-header {
    background: var(--ivory);
    padding-top: 8px; padding-bottom: 8px;
    border-bottom: 1px solid var(--ivory-deep);
  }
  .col-btn {
    height: 26px;
    border-radius: 7px; border: 1.5px solid transparent;
    font-family: 'Geist', sans-serif;
    font-size: 10px; font-weight: 600;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    letter-spacing: 0.01em; transition: all 0.15s;
    box-sizing: border-box;
  }
  .col-btn.cardio   { background: var(--cardio-bg); border-color: var(--cardio-bdr); color: var(--cardio-txt); }
  .col-btn.strength { background: var(--str-bg);    border-color: var(--str-bdr);    color: var(--str-txt); }
  .col-btn.recovery { background: var(--rec-bg);    border-color: var(--rec-bdr);    color: var(--rec-txt); }

  /* ── 스크롤 ── */
  .scroll { flex: 1; overflow-y: auto; padding-bottom: 100px; }

  /* ── 로그 테이블 ── */
  .log-table { display: flex; flex-direction: column; }

  .log-row {
    border-bottom: 1px solid var(--ivory-deep);
  }
  .log-row:last-child { border-bottom: none; }

  /* 날짜 셀 */
  .log-date {
    display: flex; align-items: center;
    padding: 0 0 0 4px; margin: 0;
  }
  .log-date-label {
    font-family: 'Geist', sans-serif;
    font-size: 11px; font-weight: 600; color: var(--bark);
    white-space: nowrap;
    display: inline-block;
  }
  /* 오늘: 글자 너비에 딱 맞는 배지 */
  .log-row.today .log-date-label {
    color: var(--ivory);
    background: var(--bark);
    padding: 2px 5px; border-radius: 5px;
  }
  .log-row.past .log-date-label { color: var(--text-soft); font-weight: 400; }
  .log-row.future .log-date-label { color: var(--text-xsoft); font-weight: 400; }

  /* 입력 셀 — g-row의 1fr 컬럼, 패딩 없음 */
  .log-cell {
    display: flex; align-items: center;
    padding: 3px 3px; margin: 0;
    box-sizing: border-box;
  }

  /* textarea → 세로 중앙: 고정 height + flex 컨테이너 */
  .log-input {
    width: 100%;
    border: none; background: transparent;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 11px; font-weight: 400;
    color: var(--text-soft);
    outline: none; resize: none;
    border-radius: 5px;
    line-height: 20px;
    height: 20px;
    text-align: center;
    overflow: hidden;
    display: block;
    padding: 0;
    box-sizing: border-box;
    transition: background 0.15s, color 0.15s;
  }
  .log-input::placeholder { color: var(--text-xsoft); }

  /* 입력값 있을 때 색상 */
  .log-input.has-cardio   { background: var(--cardio-bg); color: var(--cardio-txt); }
  .log-input.has-strength { background: var(--str-bg);    color: var(--str-txt); }
  .log-input.has-recovery { background: var(--rec-bg);    color: var(--rec-txt); }

  /* 월 구분 라벨 */
  .month-divider {
    padding: 6px 6px 4px;
    font-family: 'DM Mono', monospace;
    font-size: 9px; font-weight: 400; color: #a0a09a;
    letter-spacing: 0.1em; text-transform: uppercase;
    background: #e8e2d8;
    border-bottom: 1px solid var(--ivory-deep);
    position: sticky; top: 0;
  }

  /* ── 탭바 ── */
  .tabbar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 390px; z-index: 25;
    background: rgba(245,240,232,0.96);
    backdrop-filter: blur(12px);
    border-top: 1px solid #e2d8c8;
    padding: 14px 8px 28px;
    display: flex; justify-content: space-around; align-items: center;
  }
  .tab-item { display: flex; align-items: center; justify-content: center; flex: 1; cursor: pointer; padding: 4px; border-radius: 10px; }
  .tab-item svg { width: 28px; height: 28px; stroke: #cbbea8; fill: none; }
  .tab-item svg circle { fill: #cbbea8; stroke: none; }
  .tab-item.active svg { stroke: #4a3420; }
  .tab-item.active svg circle { fill: #4a3420; }
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="header-top">
      <div class="wordmark">
        <div class="wordmark-icon">
          <svg width="18" height="18" viewBox="0 0 100 100" fill="none">
            <ellipse cx="46" cy="91" rx="18" ry="4.5" fill="#1a0e06" opacity="0.45"/>
            <ellipse cx="46" cy="89.5" rx="13" ry="3" fill="#2e1f10" opacity="0.6"/>
            <path d="M46 88 C64 75 64 48 50 30" stroke="#c9a97a" stroke-width="5.5" stroke-linecap="round"/>
            <path d="M50 30 C44 20 26 10 8 12 C10 26 24 40 42 42 C47 43 50 37 50 30 Z" fill="#a8845a"/>
            <path d="M50 30 C60 18 78 8 94 8 C92 24 78 38 60 42 C54 44 50 38 50 30 Z" fill="#c9a97a"/>
          </svg>
        </div>
        Steady
      </div>
    </div>
    <!-- 컬럼 헤더: 항상 고정 -->
    <div class="col-header g-row">
      <div></div>
      <div class="col-btn cardio">Cardio</div>
      <div class="col-btn strength">Strength</div>
      <div class="col-btn recovery">Recovery</div>
    </div>
  </div>

  <div class="scroll">
    <div class="log-table" id="log-table"></div>
  </div>

  <!-- 탭바 -->
  <div class="tabbar">
    <div class="tab-item" onclick="location.href='steady-stretch.html'">
      <svg viewBox="4 4 36 36" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="14" cy="14" r="6" fill="none"/>
        <line x1="14" y1="4" x2="14" y2="7"/><line x1="14" y1="21" x2="14" y2="24"/>
        <line x1="4" y1="14" x2="7" y2="14"/><line x1="21" y1="14" x2="24" y2="14"/>
        <line x1="7" y1="7" x2="9" y2="9"/><line x1="19" y1="19" x2="21" y2="21"/>
        <line x1="21" y1="7" x2="19" y2="9"/><line x1="7" y1="21" x2="9" y2="19"/>
        <path d="M38 30 C34 30 30 26 30 22 C30 19 31 17 33 16 C29 17 26 20 26 24 C26 28.5 29.5 32 34 32 C37 32 39.5 30.5 41 28 C40 29 39 30 38 30 Z" style="fill:#cbbea8;opacity:0.3;stroke:none"/>
        <path d="M38 30 C34 30 30 26 30 22 C30 19 31 17 33 16 C29 17 26 20 26 24 C26 28.5 29.5 32 34 32 C37 32 39.5 30.5 41 28 C40 29 39 30 38 30 Z"/>
      </svg>
    </div>
    <div class="tab-item" onclick="location.href='steady-calendar.html'">
      <svg viewBox="0 0 26 26" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="20" height="19" rx="2"/>
        <path d="M3 10h20M8 2v4M18 2v4"/>
        <path d="M9 15l2.5 2.5L17 12"/>
      </svg>
    </div>
    <div class="tab-item active">
      <svg viewBox="0 0 26 26" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="fill:none">
        <circle cx="5" cy="7"  r="1.5" fill="#4a3420"/>
        <line x1="9" y1="7" x2="22" y2="7"/>
        <circle cx="5" cy="13" r="1.5" fill="#4a3420"/>
        <line x1="9" y1="13" x2="22" y2="13"/>
        <circle cx="5" cy="19" r="1.5" fill="#4a3420"/>
        <line x1="9" y1="19" x2="18" y2="19"/>
      </svg>
    </div>
    <div class="tab-item" onclick="location.href='steady-memo.html'">
      <svg viewBox="0 0 26 26" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 3H6a2 2 0 00-2 2v16a2 2 0 002 2h14a2 2 0 002-2V9l-7-6z"/>
        <path d="M15 3v6h7"/>
      </svg>
    </div>
  </div>

</div>

<script>
  const DAYS = ['일','월','화','수','목','금','토'];
  const COLS = ['cardio','strength','recovery'];

  function dateKey(d) {
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function saveLog(key, col, val) {
    try { localStorage.setItem('log_'+key+'_'+col, val); } catch(e){}
  }
  function loadLog(key, col) {
    try { return localStorage.getItem('log_'+key+'_'+col) || ''; } catch(e){ return ''; }
  }

  function applyClass(input, col, val) {
    input.classList.remove('has-cardio','has-strength','has-recovery');
    if (val.trim()) input.classList.add('has-'+col);
  }

  function autoResize(el) {
    el.style.height = '20px';
  }

  function buildTable() {
    const table = document.getElementById('log-table');
    table.innerHTML = '';

    const today = new Date(); today.setHours(0,0,0,0);

    // 60일 전부터 오늘까지 + 30일 미래
    const start = new Date(today); start.setDate(today.getDate() - 60);
    const end   = new Date(today); end.setDate(today.getDate() + 3);

    let prevMonth = -1;
    let todayRow = null;

    for (let d = new Date(start); d <= end; d.setDate(d.getDate()+1)) {
      const cur = new Date(d);
      const mo  = cur.getMonth();
      const key = dateKey(cur);
      const isToday = cur.getTime() === today.getTime();
      const isPast  = cur < today;

      // 월 구분
      if (mo !== prevMonth) {
        const div = document.createElement('div');
        div.className = 'month-divider';
        div.textContent = (cur.getFullYear()) + '년 ' + (mo+1) + '월';
        table.appendChild(div);
        prevMonth = mo;
      }

      const row = document.createElement('div');
      row.className = 'log-row g-row' + (isToday ? ' today' : isPast ? ' past' : ' future');

      // 날짜
      const dateCell = document.createElement('div');
      dateCell.className = 'log-date';
      dateCell.innerHTML =
        '<span class="log-date-label">' + cur.getDate() + '(' + DAYS[cur.getDay()] + ')</span>';
      row.appendChild(dateCell);

      // 3개 컬럼
      COLS.forEach(col => {
        const cell = document.createElement('div');
        cell.className = 'log-cell';

        const input = document.createElement('textarea');
        input.className = 'log-input';
        const saved = loadLog(key, col);
        input.value = saved;
        const ph = '';
        input.placeholder = ph;
        input.rows = 1;
        applyClass(input, col, saved);

        input.addEventListener('input', () => {
          autoResize(input);
          applyClass(input, col, input.value);
          saveLog(key, col, input.value);
        });
        input.addEventListener('focus', () => { autoResize(input); });

        setTimeout(() => autoResize(input), 0);
        cell.appendChild(input);
        row.appendChild(cell);
      });

      table.appendChild(row);
      if (isToday) todayRow = row;
    }

    // 오늘 행으로 스크롤
    if (todayRow) {
      setTimeout(() => todayRow.scrollIntoView({behavior:'instant', block:'center'}), 50);
    }
  }

  document.addEventListener('DOMContentLoaded', buildTable);
</script>
</body>
</html>
