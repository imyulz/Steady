<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Steady — 로그</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=DM+Mono:wght@300;400;500&family=Geist:wght@400;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ivory:      #f5f0e8;
    --ivory-mid:  #ede5d8;
    --ivory-deep: #e2d8c8;
    --ivory-dark: #cbbea8;
    --wood-mid:   #a8845a;
    --wood-dark:  #7a5c38;
    --bark:       #4a3420;
    --text-soft:  #b09070;
    --text-xsoft: #cfc0a8;
    --cardio-bg:  rgba(180,100,60,0.13);
    --cardio-bdr: rgba(180,100,60,0.45);
    --cardio-txt: #8b4a20;
    --str-bg:     rgba(44,74,50,0.13);
    --str-bdr:    rgba(44,74,50,0.42);
    --str-txt:    #2c4a32;
    --rec-bg:     rgba(80,100,140,0.10);
    --rec-bdr:    rgba(80,100,140,0.36);
    --rec-txt:    #3a4e6e;
  }
  html, body { height: 100%; background: #ddd5c4; }
  .app { max-width: 390px; min-height: 100vh; margin: 0 auto; background: var(--ivory); display: flex; flex-direction: column; }

  /* ── 헤더 ── */
  .header {
    padding: 52px 0 0;
    background: var(--ivory);
    position: sticky; top: 0; z-index: 10;
    border-bottom: 1px solid var(--ivory-deep);
  }
  .header-top {
    display: flex; align-items: flex-end; justify-content: space-between;
    padding: 0 14px 12px;
  }
  .wordmark {
    font-family: 'Cormorant Garamond', serif;
    font-size: 24px; font-weight: 600; font-style: italic;
    color: var(--bark); letter-spacing: -0.02em;
    display: flex; align-items: center; gap: 8px;
  }
  .wordmark-icon {
    width: 28px; height: 28px; border-radius: 7px;
    background: linear-gradient(155deg, #5a3e24, #2e1f10);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 8px rgba(46,31,16,0.3); flex-shrink: 0;
  }

  /* ── 공통 그리드 ── */
  /* 헤더와 데이터 행이 완전히 동일한 그리드 */
  .g-row {
    display: grid;
    grid-template-columns: 56px 1fr 1fr 1fr;
    gap: 4px;
    padding: 0 14px;
    box-sizing: border-box;
    width: 100%;
  }

  /* 컬럼 헤더 (sticky) */
  .col-header {
    background: var(--ivory);
    padding-top: 8px; padding-bottom: 8px;
    border-bottom: 1px solid var(--ivory-deep);
  }
  .col-btn {
    height: 26px;
    border-radius: 7px; border: 1.5px solid transparent;
    font-family: 'Geist', sans-serif;
    font-size: 10px; font-weight: 600;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    letter-spacing: 0.01em; transition: all 0.15s;
    box-sizing: border-box;
  }
  .col-btn.cardio   { background: var(--cardio-bg); border-color: var(--cardio-bdr); color: var(--cardio-txt); }
  .col-btn.strength { background: var(--str-bg);    border-color: var(--str-bdr);    color: var(--str-txt); }
  .col-btn.recovery { background: var(--rec-bg);    border-color: var(--rec-bdr);    color: var(--rec-txt); }

  /* ── 스크롤 ── */
  .scroll { flex: 1; overflow-y: auto; padding-bottom: 100px; }

  /* ── 로그 테이블 ── */
  .log-table { display: flex; flex-direction: column; }

  .log-row {
    border-bottom: 1px solid var(--ivory-deep);
  }
  .log-row:last-child { border-bottom: none; }

  /* 날짜 셀 */
  .log-date {
    display: flex; align-items: center;
    padding: 0 0 0 4px; margin: 0;
  }
  .log-date-label {
    font-family: 'Geist', sans-serif;
    font-size: 11px; font-weight: 600; color: var(--bark);
    white-space: nowrap;
    display: inline-block;
  }
  /* 오늘: 글자 너비에 딱 맞는 배지 */
  .log-row.today .log-date-label {
    color: var(--ivory);
    background: var(--bark);
    padding: 2px 5px; border-radius: 5px;
  }
  .log-row.past .log-date-label { color: var(--text-soft); font-weight: 400; }
  .log-row.future .log-date-label { color: var(--text-xsoft); font-weight: 400; }

  /* 입력 셀 — g-row의 1fr 컬럼, 패딩 없음 */
  .log-cell {
    display: flex; align-items: center;
    padding: 3px 3px; margin: 0;
    box-sizing: border-box;
  }

  /* textarea → 세로 중앙: 고정 height + flex 컨테이너 */
  .log-input {
    width: 100%;
    border: none; background: transparent;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 11px; font-weight: 400;
    color: var(--text-soft);
    outline: none; resize: none;
    border-radius: 5px;
    line-height: 20px;
    height: 20px;
    text-align: center;
    overflow: hidden;
    display: block;
    padding: 0;
    box-sizing: border-box;
    transition: background 0.15s, color 0.15s;
  }
  .log-input::placeholder { color: var(--text-xsoft); }

  /* 입력값 있을 때 색상 */
  .log-input.has-cardio   { background: var(--cardio-bg); color: var(--cardio-txt); }
  .log-input.has-strength { background: var(--str-bg);    color: var(--str-txt); }
  .log-input.has-recovery { background: var(--rec-bg);    color: var(--rec-txt); }

  /* 월 구분 라벨 */
  .month-divider {
    padding: 6px 6px 4px;
    font-family: 'DM Mono', monospace;
    font-size: 9px; font-weight: 400; color: #a0a09a;
    letter-spacing: 0.1em; text-transform: uppercase;
    background: #e8e2d8;
    border-bottom: 1px solid var(--ivory-deep);
    position: sticky; top: 0;
  }

  /* ── 탭바 ── */
  .tabbar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 390px; z-index: 25;
    background: rgba(245,240,232,0.96);
    backdrop-filter: blur(12px);
    border-top: 1px solid #e2d8c8;
    padding: 14px 8px 28px;
    display: flex; justify-content: space-around; align-items: center;
  }
  .tab-item { display: flex; align-items: center; justify-content: center; flex: 1; cursor: pointer; padding: 4px; border-radius: 10px; }
  .tab-item svg { width: 28px; height: 28px; stroke: #cbbea8; fill: none; }
  .tab-item svg circle { fill: #cbbea8; stroke: none; }
  .tab-item.active svg { stroke: #4a3420; }
  .tab-item.active svg circle { fill: #4a3420; }
</style>
</head>

<script>
  const DAYS = ['일','월','화','수','목','금','토'];
  const COLS = ['cardio','strength','recovery'];

  function dateKey(d) {
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function saveLog(key, col, val) {
    try { localStorage.setItem('log_'+key+'_'+col, val); } catch(e){}
  }
  function loadLog(key, col) {
    try { return localStorage.getItem('log_'+key+'_'+col) || ''; } catch(e){ return ''; }
  }

  function applyClass(input, col, val) {
    input.classList.remove('has-cardio','has-strength','has-recovery');
    if (val.trim()) input.classList.add('has-'+col);
  }

  function autoResize(el) {
    el.style.height = '20px';
  }

  function buildTable() {
    const table = document.getElementById('log-table');
    table.innerHTML = '';

    const today = new Date(); today.setHours(0,0,0,0);

    // 60일 전부터 오늘까지 + 30일 미래
    const start = new Date(today); start.setDate(today.getDate() - 60);
    const end   = new Date(today); end.setDate(today.getDate() + 3);

    let prevMonth = -1;
    let todayRow = null;

    for (let d = new Date(start); d <= end; d.setDate(d.getDate()+1)) {
      const cur = new Date(d);
      const mo  = cur.getMonth();
      const key = dateKey(cur);
      const isToday = cur.getTime() === today.getTime();
      const isPast  = cur < today;

      // 월 구분
      if (mo !== prevMonth) {
        const div = document.createElement('div');
        div.className = 'month-divider';
        div.textContent = (cur.getFullYear()) + '년 ' + (mo+1) + '월';
        table.appendChild(div);
        prevMonth = mo;
      }

      const row = document.createElement('div');
      row.className = 'log-row g-row' + (isToday ? ' today' : isPast ? ' past' : ' future');

      // 날짜
      const dateCell = document.createElement('div');
      dateCell.className = 'log-date';
      dateCell.innerHTML =
        '<span class="log-date-label">' + cur.getDate() + '(' + DAYS[cur.getDay()] + ')</span>';
      row.appendChild(dateCell);

      // 3개 컬럼
      COLS.forEach(col => {
        const cell = document.createElement('div');
        cell.className = 'log-cell';

        const input = document.createElement('textarea');
        input.className = 'log-input';
        const saved = loadLog(key, col);
        input.value = saved;
        const ph = '';
        input.placeholder = ph;
        input.rows = 1;
        applyClass(input, col, saved);

        input.addEventListener('input', () => {
          autoResize(input);
          applyClass(input, col, input.value);
          saveLog(key, col, input.value);
        });
        input.addEventListener('focus', () => { autoResize(input); });

        setTimeout(() => autoResize(input), 0);
        cell.appendChild(input);
        row.appendChild(cell);
      });

      table.appendChild(row);
      if (isToday) todayRow = row;
    }

    // 오늘 행으로 스크롤
    if (todayRow) {
      setTimeout(() => todayRow.scrollIntoView({behavior:'instant', block:'center'}), 50);
    }
  }

  document.addEventListener('DOMContentLoaded', buildTable);
</script>
